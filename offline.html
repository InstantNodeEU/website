<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060606">
<title>Offline - InstantNode</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#060606;color:#f2f1ee;font-family:"Satoshi",system-ui,sans-serif;text-align:center;padding:24px}
  .box{max-width:360px;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px 28px;background:#0e0e10}
  h1{font-size:1.4rem;font-weight:500;letter-spacing:-.01em;margin:0 0 8px}
  p{color:#8f8e8a;font-size:.95rem;line-height:1.5;margin:0 0 20px}
  button{background:#f2f1ee;color:#060606;border:0;border-radius:999px;padding:10px 22px;font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit}
</style>
  <link rel="discord:component-embed" type="application/json" href="https://instantnode.eu/discord-embed.json">
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
    <p>InstantNode needs a connection to show live server data. Your servers keep running - only this app is waiting for network.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>

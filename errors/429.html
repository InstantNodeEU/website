<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#060606" />
    <meta name="darkreader-lock" />
    <title>Too many requests | InstantNode</title>
    <style>
      /* Self-contained on purpose: an error page must render even when the CDN,
         the app or the font host is having a bad day. ponytail: no build step. */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #060606; color: #f2f1ee; min-height: 100dvh;
        font-family: 'Satoshi', 'Proxima Vara', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; position: relative; overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(58% 42% at 50% 4%, rgba(59, 130, 246, 0.14), transparent 70%),
          radial-gradient(38% 38% at 10% 100%, rgba(34, 211, 238, 0.07), transparent 70%),
          radial-gradient(38% 38% at 90% 92%, rgba(139, 92, 246, 0.07), transparent 70%);
      }
      .grid { position: fixed; inset: 0; z-index: 0; opacity: 0.45;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 78%);
                mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 78%);
      }
      .card { position: relative; z-index: 1; width: 100%; max-width: 30rem; text-align: center;
        background: rgba(11, 11, 12, 0.92); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
        padding: 46px 34px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .card::before { content: ""; position: absolute; left: 14%; right: 14%; top: 0; height: 1px;
        background: linear-gradient(90deg, transparent, #22d3ee, #3b82f6 52%, #8b5cf6, transparent); opacity: 0.75; }
      .brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 30px; }
      .brand svg { width: 24px; height: 24px; }
      .brand span { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
      .code { font-size: clamp(3.6rem, 14vw, 5.2rem); font-weight: 800; line-height: 1; letter-spacing: -0.045em;
        background: linear-gradient(180deg, #f2f1ee 0%, #93c5fd 58%, #3b82f6 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
      h1 { margin-top: 14px; font-size: 1.3rem; font-weight: 600; letter-spacing: -0.015em; }
      p { margin: 10px auto 0; color: #8f8e89; font-size: 0.94rem; line-height: 1.65; max-width: 26rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 600;
        text-decoration: none; padding: 0.7rem 1.4rem; border-radius: 999px; transition: opacity 0.15s, border-color 0.15s, color 0.15s; }
      .btn-primary { background: #f2f1ee; color: #060606; }
      .btn-primary:hover { opacity: 0.85; }
      .btn-ghost { border: 1px solid rgba(255, 255, 255, 0.14); color: #8f8e89; }
      .btn-ghost:hover { color: #f2f1ee; border-color: rgba(255, 255, 255, 0.28); }
      .foot { margin-top: 24px; font-size: 0.7rem; color: #5c5b57; letter-spacing: 0.06em;
        font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace; }
      @media (prefers-reduced-motion: no-preference) {
        .card { animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <main class="card">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h6l-1 7 9-11h-6z" /></svg>
        <span>InstantNode</span>
      </div>
      <div class="code">429</div>
      <h1>Too many requests</h1>
      <p>You are going a little fast. Please wait a moment and try again.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://instantnode.eu/">Back to InstantNode</a>
        <a class="btn btn-ghost" href="https://status.instantnode.eu">Service status</a>
      </div>
      <p class="foot">INSTANTNODE.EU</p>
    </main>
  </body>
</html>
